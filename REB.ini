# FF1/FF2 above.
BACKLASH             = 0.0000

MIN_FERROR           = 0.5
FERROR               = 5

DEADBAND             = 0.000015
MAX_OUTPUT           = 10.0

# NOTE: P/I/D/FF0/FF1/FF2 below are historical starting values only.
# The live, tunable values are on the Settings tab's "Stepper Motor
# Settings" section, persisted in /home/reuben/Documents/REBset_v1.ini,
# and are no longer read from this ini file at HAL load (see REB.hal).
P_VEL                = 35
I_VEL                = 20
D_VEL                = 1.2
BIAS_VEL             = 0.0
FF0_VEL              = 1.0
FF1_VEL              = 0.0
FF2_VEL              = 0.0

MAX_OUTPUT_VEL       = 10.0

# I_POS was 20 (unchanged since before the P_POS/FF0_POS/MAX_OUTPUT_POS
# retune below) - live testing on Sp0 (2026-07-28) showed a sustained,
# non-decaying oscillation spanning ~300 degrees of travel, output
# saturated at MAX_OUTPUT_POS ~43% of the time, M19 timing out without
# ever reaching ORIENT_TOLERANCE. With P_POS=1.0, I=20 alone reaches
# MAX_OUTPUT_POS from well under a second of typical index error -
# classic integral windup once saturated, since MAX_ERROR_I_POS below
# didn't exist yet to clamp it. Cut by 20x and added that clamp;
# retest live and retune from here.
# Retest after the I_POS/MAX_ERROR_I_POS fix above (2026-07-28) converged
# cleanly with no saturation - output never exceeded ~0.22 of the 1.0
# ceiling even at the initial ~90 degree error, so there's plenty of
# headroom to raise P_POS for a faster approach without reintroducing
# saturation. Doubled; I_POS/D_POS left alone so this test isolates the
# effect of P_POS alone. Retest live and retune from here.
# NOTE: P/I/D/FF0/FF1/FF2 below are historical starting values only.
# The live, tunable values are on the Settings tab's "Stepper Motor
# Settings" section, persisted in /home/reuben/Documents/REBset_v1.ini,
# and are no longer read from this ini file at HAL load (see REB.hal).
P_POS                = 2.0
I_POS                = 1.0
D_POS                = 1.2
BIAS_POS             = 0.0
FF0_POS              = 0.0
FF1_POS              = 0.0
FF2_POS              = 0.0

# Anti-windup clamp on the integrator's accumulated error (pid.pN.maxerrorI).
# Bounds the I term's own max contribution to Igain * MAX_ERROR_I_POS,
# so it can't by itself hold the output pinned at MAX_OUTPUT_POS long
# after the error has reversed sign. Was unset (0 = unlimited).
MAX_ERROR_I_POS      = 0.05

MAX_OUTPUT_POS		 = 1.0

# How close (in degrees) orient must get to the target angle before M19
# reports the spindle as oriented.
ORIENT_TOLERANCE     = 0.1

# For the StepperOnline DM542T Digital Stepper Drive 
# These are 5 μs = 5,000 ns
DIRHOLD              = 5000
DIRSETUP             = 5000
# These are 2.5 μs = 2,500 ns
STEPLEN              = 2500
STEPSPACE            = 2500
# ********************************************************************
