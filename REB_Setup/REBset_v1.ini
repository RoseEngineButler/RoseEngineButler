<settings>
    <channel_assignments>
        <channel id="00">W</channel>
        <channel id="01">Z</channel>
        <channel id="02">U</channel>
        <channel id="03">V</channel>
        <channel id="04">X</channel>
        <channel id="05">B</channel>
    </channel_assignments>
    <max_angular_velocity>10.000000</max_angular_velocity>
    <default_angular_velocity>1.000000</default_angular_velocity>
    <device_names>
        <name>Ampitude Adjuster</name>
        <name>Cross Slide</name>
        <name>Curvilinear Slide</name>
        <name>Multi-Angle Arm</name>
        <name>Retractor</name>
        <name>Rosette Fader</name>
        <name>Rosette Phaser/Multiplier (Sp1)</name>
        <name>Spherical Slide</name>
        <name>Spindle (Sp0)</name>
        <name>Other</name>
    </device_names>
    <measurement_system>Imperial</measurement_system>
    <axis id="A">
        <scale>-20460</scale>
            <pid>
            <P>5</P>
            <I>1</I>
            <D>1.2</D>
            <FF0>2</FF0>
            <FF1>1</FF1>
            <FF2>0</FF2>
        </pid>
    </axis>
    <axis id="B">
        <scale>1</scale>
        <usercomment>Spindle (Sp0)</usercomment>
        <backlash>0.0</backlash>
        <usercomment></usercomment>
        <pid>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid>
    </axis>
    <axis id="C">
        <scale>1</scale>
            <pid>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid>
    </axis>
    <axis id="U">
        <scale>1</scale>
        <usercomment>Retractor</usercomment>
        <backlash>0.0</backlash>
        <usercomment></usercomment>
        <pid>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid>
    </axis>
    <axis id="V">
        <scale>1</scale>
        <usercomment>Ampitude Adjuster</usercomment>
        <backlash>0.0</backlash>
        <usercomment></usercomment>
        <pid>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid>
    </axis>
    <axis id="W">
        <scale>1</scale>
        <usercomment>Rosette Fader</usercomment>
        <backlash>0.0</backlash>
        <usercomment></usercomment>
        <pid>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid>
    </axis>
    <axis id="X">
        <scale>1</scale>
        <usercomment>Cross Slide</usercomment>
        <backlash>0.0</backlash>
        <usercomment>Cross Slide</usercomment>
        <pid>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid>
    </axis>
    <axis id="Z">
        <scale>1</scale>
        <usercomment>Cross Slide</usercomment>
        <backlash>0.0</backlash>
        <usercomment>Cross Slide</usercomment>
        <pid>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid>
    </axis>
    <axis id="Sp0">
        <scale>1</scale>
        <backlash>0.0</backlash>
        <pid_pos>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid_pos>
        <pid_vel>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid_vel>
    </axis>
    <axis id="Sp1">
        <scale>1</scale>
        <backlash>0.0</backlash>
        <pid_pos>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid_pos>
        <pid_vel>
            <P>1</P>
            <I>0</I>
            <D>0</D>
            <FF0>0</FF0>
            <FF1>0</FF1>
            <FF2>0</FF2>
        </pid_vel>
    </axis>
</settings>

